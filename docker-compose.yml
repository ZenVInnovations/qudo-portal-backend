# Local-dev Postgres for the qudo-portal-backend.
# Brings up a single Postgres 16 instance on localhost:5432 with the
# credentials baked into application.yml's defaults. The BE itself is
# expected to be run separately via `mvn spring-boot:run`.
#
#   docker compose up -d        # start Postgres in the background
#   docker compose logs -f db   # tail Postgres logs
#   docker compose down         # stop (data persists in the named volume)
#   docker compose down -v      # stop AND wipe the data volume
#
# Override credentials via env / .env file if you don't want the defaults.
# The product catalog + audit trail live here — see db/migration/*.sql.

services:
  db:
    image: postgres:16-alpine
    container_name: qudo-portal-db
    environment:
      POSTGRES_DB: ${DB_NAME:-qudo_portal}
      POSTGRES_USER: ${DB_USERNAME:-qudo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-qudo_local_dev}
    ports:
      - "5432:5432"
    volumes:
      - qudo-portal-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  qudo-portal-db:
