# Test profile overrides. The Postgres URL/username/password are injected
# dynamically by AbstractIntegrationTest's @DynamicPropertySource hook from
# the Testcontainers Postgres instance — see the test base class.

spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  scanner:
    enabled: false   # tests don't probe external hosts

logging:
  level:
    "[com.pqc]": INFO
    "[org.hibernate]": WARN
