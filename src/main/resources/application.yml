server:
  port: 8093

spring:
  application:
    name: qudo-portal-backend

  # Persistence for the product catalog + audit trail. Postgres is required
  # (start it with `docker compose up -d`). Secrets/host come from env; the
  # localhost defaults match docker-compose.yml.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/qudo_portal}
    username: ${DB_USERNAME:qudo}
    password: ${DB_PASSWORD:qudo_local_dev}
  jpa:
    hibernate:
      # Schema is owned by Flyway; Hibernate only validates the mapping.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${SMTP_ADDRESS:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER_NAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  frontend:
    # Origin of the React app — used for the CORS allow-list.
    origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  admin:
    # Single administrator credential for the product-management API
    # (/api/v1/admin/**). Supplied via env — NEVER committed. The password is a
    # BCrypt hash, not plaintext. dev/prod FAIL CLOSED at startup if unset; the
    # `local` profile ships a clearly-flagged dev-only default.
    username: ${ADMIN_USERNAME:}
    password-hash: ${ADMIN_PASSWORD_HASH:}
  ratelimit:
    # Per-IP token-bucket rate limits for the abusable public endpoints.
    # Replaces the original plan to gate the sandbox behind Google sign-in:
    # the primitives surface stays free to evaluate, but no single client IP
    # can pin the JNI provider or the scanner executor. See RateLimitFilter.
    enabled: ${APP_RATELIMIT_ENABLED:true}
    sandbox:
      # ML-DSA-65 sign is single-digit-ms — 60/min/IP is plenty for live
      # exploration and still caps a hostile loop.
      rpm: ${APP_RATELIMIT_SANDBOX_RPM:60}
      burst: ${APP_RATELIMIT_SANDBOX_BURST:20}
    scanner:
      # Scans run real openssl s_client probes; each one is 1-5 seconds.
      # Keep this low so a burst can't tie up the bounded executor.
      rpm: ${APP_RATELIMIT_SCANNER_RPM:10}
      burst: ${APP_RATELIMIT_SCANNER_BURST:5}
    demo:
      # One-shot lead-capture form. Tight budget to deter spam.
      rpm: ${APP_RATELIMIT_DEMO_RPM:5}
      burst: ${APP_RATELIMIT_DEMO_BURST:3}
  scanner:
    # Master kill switch for the TLS posture scanner. Set to false in prod
    # to disable the endpoint entirely (returns 503 instead of probing).
    enabled: ${APP_SCANNER_ENABLED:true}
    # Allow scanning loopback / RFC-1918 / link-local addresses. Defaults
    # to FALSE — the scanner is exposed publicly and must never be
    # turnable into an SSRF reflector against the BE's internal network
    # or cloud metadata endpoints (169.254.169.254). Set
    # APP_SCANNER_ALLOW_PRIVATE=true ONLY for local dev runs against
    # localhost:8443, never for any deployment reachable from untrusted
    # networks.
    allow-private-addresses: ${APP_SCANNER_ALLOW_PRIVATE:false}
    # Cap on captured openssl output bytes — defends against an oversized
    # response from a malicious target trying to OOM the BE.
    max-output-bytes: ${APP_SCANNER_MAX_OUTPUT_BYTES:65536}

demo:
  notification:
    # Where the demo-request notifications land. john@zenv.ai is the
    # support inbox; override via DEMO_NOTIFY_TO at deploy time if a
    # different person owns the funnel.
    to: ${DEMO_NOTIFY_TO:john@zenv.ai}
    # Outbound sender identity. noreply@zenv.ai is a Workspace alias /
    # group; the actual SMTP auth happens via spring.mail.username
    # (john@zenv.ai + app password) with "Send mail as" verified for
    # noreply on that account, OR via Workspace SMTP relay once that's
    # turned on. From the recipient's perspective the mail always
    # reads: "Qudo PQC (ZenV Quantum)" <noreply@zenv.ai>.
    from: ${DEMO_NOTIFY_FROM:noreply@zenv.ai}
    fromName: ${DEMO_NOTIFY_FROM_NAME:Qudo PQC (ZenV Quantum)}
  keys:
    dir: ${DEMO_KEYS_DIR:./keys}

management:
  endpoints:
    web:
      exposure:
        # Add prometheus + loggers; keep info + health. Lock down further in
        # prod via a management.security profile that requires basic auth on
        # the management context.
        include: health,info,prometheus,loggers,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-components: when-authorized
  health:
    # Don't let the JavaMail health probe gate the overall /actuator/health
    # status. SMTP creds are optional (demo notifications are best-effort —
    # DemoRequestController logs a warn and continues if send fails), so a
    # missing SMTP password must not make the BE look DOWN to K8s probes
    # or to upstream load balancers.
    mail:
      enabled: false
  metrics:
    tags:
      application: qudo-portal-backend

logging:
  level:
    "[com.pqc]": INFO
