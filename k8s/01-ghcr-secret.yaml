# Image-pull secret for ghcr.io. The qudo-portal-{backend,frontend} images
# are pushed to ghcr.io/zenvinnovations/* (private), and every Pod in this
# namespace references this secret via spec.imagePullSecrets.
#
# DO NOT commit this file with real credentials. Create the secret directly
# against the cluster via the imperative command below — the resulting
# Secret object is stored only in etcd, not in Git.
#
#   GHCR_TOKEN=ghp_xxx                 # PAT with read:packages
#   GHCR_USER=<your-github-username>
#   kubectl -n qudo-portal-dev create secret docker-registry ghcr-secret \
#       --docker-server=ghcr.io \
#       --docker-username="$GHCR_USER" \
#       --docker-password="$GHCR_TOKEN" \
#       --docker-email=devops@zenv.ai
#
# This YAML is committed as a placeholder so `kubectl apply -f k8s/` doesn't
# silently skip it. After running the kubectl create above, the secret is
# managed imperatively — re-running `kubectl apply -f` on this file will
# NOT overwrite the real values because the placeholder below has the same
# name and Kubernetes will reject the empty dockerconfigjson.
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-secret
  namespace: qudo-portal-dev
  annotations:
    description: "PLACEHOLDER — populate via 'kubectl create secret docker-registry' above"
type: kubernetes.io/dockerconfigjson
data:
  # Base64-encoded empty docker config — replace via the kubectl command above.
  .dockerconfigjson: e30=
