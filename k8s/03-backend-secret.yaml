# SMTP credentials for the demo-notification mail send. Stored separately
# from the ConfigMap so secret rotation doesn't churn the whole deploy.
#
# DO NOT commit this file with real values. Either replace the placeholders
# below before applying, or create the secret imperatively (preferred —
# never touches Git):
#
#   kubectl -n qudo-portal-dev create secret generic qudo-portal-backend-smtp \
#       --from-literal=SMTP_USER_NAME='noreply@zenv.ai' \
#       --from-literal=SMTP_PASSWORD='<app-password>'
#
# Gmail requires an App Password, not the account password — generate at
# myaccount.google.com → Security → 2-step Verification → App passwords.
#
# Mail send in the BE is BEST-EFFORT: DemoRequestController catches send
# failures and continues, the demo-request still returns 200 to the FE.
# So if you don't have SMTP creds yet, deploying with the placeholders
# below is fine — every demo form submission logs a WARN and proceeds.
# The /actuator/health probes are NOT gated on SMTP (we disabled the
# MailHealthIndicator in application.yml).
apiVersion: v1
kind: Secret
metadata:
  name: qudo-portal-backend-smtp
  namespace: qudo-portal-dev
  labels:
    app.kubernetes.io/name: qudo-portal-backend
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  # stringData (vs data) means Kubernetes base64-encodes these for you.
  # Replace the placeholders below before `kubectl apply`, or use the
  # imperative `kubectl create secret` command above.
  SMTP_USER_NAME: "REPLACE_ME"
  SMTP_PASSWORD: "REPLACE_ME"
